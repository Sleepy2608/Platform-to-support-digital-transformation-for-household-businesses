# =============================================================
# HBDT Platform — Development Configuration
# =============================================================

# MySQL Datasource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:household_business_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:dev-secret-key-hbdt-platform-256-bits-long-minimum-change-in-production}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Logging
logging.level.com.hbdt=DEBUG
logging.level.org.springframework.security=DEBUG

# =============================================================
# Spring Mail (Gmail SMTP — replace with your credentials in .env)
# =============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =============================================================
# File Upload
# =============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# =============================================================
# OTP Configuration
# =============================================================
# OTP Time-to-live (minutes)
app.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
# When true, OTPs are printed to console instead of emailed
app.otp.dev-mode=${OTP_DEV_MODE:true}

# Canonical reference roles are required. Demo accounts are explicit opt-in.
app.seed.roles-enabled=${APP_SEED_ROLES_ENABLED:true}
app.seed.demo-users-enabled=${APP_SEED_DEMO_USERS_ENABLED:false}

# Reference data is kept in memory and does not create database tables.
app.reference-data.enabled=${APP_REFERENCE_DATA_ENABLED:true}
