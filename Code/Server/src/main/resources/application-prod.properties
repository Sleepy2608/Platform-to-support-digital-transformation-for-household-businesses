# =============================================================
# HBDT Platform — Production Configuration
# =============================================================

# MySQL Datasource
spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQLHOST}}:${DB_PORT:${MYSQLPORT}}/${DB_NAME:${MYSQLDATABASE}}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:${MYSQLUSER}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Logging
logging.level.com.hbdt=INFO

# Production nen tro UPLOAD_DIR den persistent volume va APP_PUBLIC_BASE_URL den public API domain.
app.upload.dir=${UPLOAD_DIR:}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.seed.roles-enabled=${APP_SEED_ROLES_ENABLED:true}
app.seed.demo-users-enabled=false
app.reference-data.enabled=${APP_REFERENCE_DATA_ENABLED:true}
app.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
app.otp.dev-mode=${OTP_DEV_MODE:false}

# Mail configuration used by OTP flows.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
