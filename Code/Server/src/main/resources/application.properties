# =============================================================
# HBDT Platform — Application Configuration
# =============================================================

# Server
server.port=${SERVER_PORT:8080}

# Load a local .env file when present. The file remains excluded by .gitignore.
spring.config.import=optional:file:.env[.properties]

# SSE notification requests are long-lived; never retain a JPA session/connection
# for their entire lifetime. Service methods define their own transaction boundary.
spring.jpa.open-in-view=false

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Internal B.ai extraction service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.api-secret=${AI_SERVICE_API_SECRET:}
ai.service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:35}
