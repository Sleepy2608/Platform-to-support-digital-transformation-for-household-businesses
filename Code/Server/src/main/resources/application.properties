# =============================================================
# HBDT Platform — Application Configuration
# =============================================================

# Server
server.port=${SERVER_PORT:8080}

# Load a local .env file when present. The file remains excluded by .gitignore.
spring.config.import=optional:file:.env[.properties],optional:file:Code/Server/.env[.properties]

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database schema is managed exclusively by Flyway migrations.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
