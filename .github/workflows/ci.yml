name: Java & Next.js CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # BACKEND: Java Spring Boot 3.3.0 + JDK 21 + Maven
  # ============================================================
  backend:
    name: Backend - Compile & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Code/Server

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: Code/Server/pom.xml

      - name: Compile
        run: mvn compile -B

      - name: Run tests
        run: mvn test -B

  # ============================================================
  # FRONTEND: Next.js + React + TypeScript
  # ============================================================
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Code/Client/src/frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Code/Client/src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
