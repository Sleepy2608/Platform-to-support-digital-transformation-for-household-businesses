name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # FRONTEND: Next.js (React + TypeScript)
  # ============================================================
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Code/Client/src/frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Code/Client/src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ============================================================
  # BACKEND: Java Spring Boot (Modular Monolith)
  # ============================================================
  backend:
    name: Backend - Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: mvn compile -f backend/pom.xml

      - name: Run tests
        run: mvn test -f backend/pom.xml

  # ============================================================
  # AI SERVICE: Python FastAPI
  # ============================================================
  ai-service:
    name: AI Service - Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint check
        run: pip install flake8 && flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: python -m pytest || echo "No tests found"

  # ============================================================
  # DOCKER BUILD (optional - kiểm tra image build được không)
  # ============================================================
  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-service]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build --parallel
