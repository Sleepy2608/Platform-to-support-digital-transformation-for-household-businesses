services:
  mysql:
    image: mysql:8.0
    container_name: agritrade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agritrade
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Code/Server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Code/Server
    container_name: agritrade-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: agritrade
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: dev-only-secret-change-in-production
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./Code/AI
    container_name: agritrade-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Code/Client/src/frontend
    container_name: agritrade-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
