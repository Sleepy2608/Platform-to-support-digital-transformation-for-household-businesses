services:
  mysql:
    image: mysql:8.0
    container_name: hbdt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-hbdt_platform}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Code/Server/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Code/Server
    container_name: hbdt-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hbdt_platform}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-hbdt-platform-256-bits-long-change-me}
      OTP_DEV_MODE: "true"
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./Code/AI
    container_name: hbdt-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Code/Client/src/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: hbdt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
